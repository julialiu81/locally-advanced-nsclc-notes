 之後繼續 osimertinib。無對照組。", "section": "sequence", "kind": "design"}, {"label": "主要終點與分析", "html": "主要終點：12 個月 PFS。", "section": "sequence", "kind": "design"}, {"label": "研究登錄", "html": "NEOLA<br>NCT06194448", "section": "sequence", "kind": "design"}, {"label": "病理反應", "html": "不適用", "section": "sequence", "kind": "result"}, {"label": "主要終點（EFS／DFS／PFS）", "html": "尚無結果；主要終點 12月 PFS", "section": "sequence", "kind": "result"}, {"label": "整體存活（OS）", "html": "尚無結果", "section": "sequence", "kind": "result"}, {"label": "手術與安全性", "html": "尚無結果", "section": "sequence", "kind": "result"}, {"label": "報告版本與截止", "html": "2025 研究計畫論文（protocol）", "section": "sequence", "kind": "result"}, {"label": "如何解讀", "html": "本表為2025 protocol設計；這是將TKI提前的研究，非LAURA的直接替代證據。", "section": "sequence", "kind": "read"}], "refs": ["neola"], "search": "不可切除第 III 期；敏感 EGFR 突變 全球、多中心、開放、單臂第二期；本版為研究計畫 誘導：osimertinib → 根治性化放療 → 之後繼續 osimertinib。無對照組。 主要終點：12 個月 PFS。 NEOLA NCT06194448 不適用 尚無結果；主要終點 12月 PFS 尚無結果 尚無結果 2025 研究計畫論文（protocol） 本表為2025 protocol設計；這是將TKI提前的研究，非LAURA的直接替代證據。 不可切除 III 期；敏感 EGFR突變", "designVisual": {"entry": "不可切除 III 期；敏感 EGFR突變", "allocation": "單臂第二期；本版為研究計畫", "arms": [{"label": "osimertinib序列治療組", "n": "尚無本版結果分母", "steps": ["osimertinib誘導", "根治化放療", "osimertinib"]}], "note": "主要觀察12個月PFS；研究計畫不能視為已證實療效。"}, "metrics": []}], "topics": [{"id": "map", "title": "臨床情境與閱讀路徑", "subtitle": "從病人的治療起點讀起", "pages": ["<p>本筆記整理非小細胞肺癌（non-small-cell lung cancer, NSCLC）的術前、圍手術期及局部晚期治療。以臨床問題安排閱讀順序：病人是否可切除、是否有可作用的驅動基因變異，以及治療是在手術前、手術後，還是根治性化放療之後開始。</p><p>各表列出研究情境、方法、治療順序與結果版本。納入關鍵隨機試驗，並選錄與治療降階、轉換手術及新治療序列直接相關的研究；這是一份主題式閱讀整理，並非系統性文獻回顧。數值以所引版本為準，不以跨試驗風險比排列療法優劣。</p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"先以治療路徑找到對應試驗\"><table><caption>表 1．先以治療路徑找到對應試驗</caption><thead><tr><th scope=\"col\">臨床情境</th><th scope=\"col\">治療順序</th><th scope=\"col\">代表研究</th></tr></thead><tbody><tr><th scope=\"row\">可切除，術前免疫化療</th><td>術前全身治療 → 手術；是否給術後免疫須依研究設計區分</td><td>CheckMate 816（術前三週期，未規定術後免疫）；圍手術期研究見下一列</td></tr><tr><th scope=\"row\">可切除，圍手術期免疫策略</th><td>術前免疫＋化療 → 手術 → 術後免疫</td><td>KEYNOTE-671、AEGEAN、CheckMate 77T、RATIONALE-315、Neotorch、NADIM II；陰性第三期試驗 IMpower030</td></tr><tr><th scope=\"row\">可切除，驅動基因陽性</th><td>術前標靶研究，或完全切除後的輔助標靶</td><td>術前：NeoADAURA；術前 ALK 單臂研究 ALNEO、NAUTIKA1、LORIN（LORIN 一半為轉換治療，另見邊界可切除章）。術後：ADAURA、ALINA、LIBRETTO-432；會議報告 RAPHAEL</td></tr><tr><th scope=\"row\">可切除，先手術、術後免疫</th><td>完整切除（多數已接受術後化療）→ 術後隨機分派免疫治療或對照</td><td>IMpower010、KEYNOTE-091；術前免疫化療與手術後、依病理反應再隨機的 ADOPT-lung、INTerpath-009</td></tr><tr><th scope=\"row\">不可切除第 III 期</th><td>根治性化學放射治療 → 未惡化者接受鞏固治療；或化放療開始即隨機；或先誘導再化放療</td><td>化放療後鞏固：PACIFIC、PACIFIC-5、GEMSTONE-301；EGFR Ex19del／L858R 族群看 LAURA、POLESTAR。化放療開始即隨機：PACIFIC-2、CheckMate 73L。誘導後化放療：APOLO、PACIFIC-Brazil、NEOLA</td></tr><tr><th scope=\"row\">邊界可切除或治療後殘存疾病</th><td>先定義局部根治方案，再依反應與可切除性重新評估</td><td>MDT-BRIDGE；轉換手術的單臂資料另見 LORIN、JS207</td></tr></tbody></table></div><p class=\"table-note\">研究路徑示意；試驗納入條件與目前各地核准、給付條件是不同層次的資訊。</p>", "<aside class=\"callout\"><strong>第 III 期並非單一治療族群</strong><p>分期名稱相同，仍可能在淋巴結站別、腫瘤侵犯、可完成的切除範圍及心肺功能上差異很大。可切除性是腫瘤能否完整移除；可手術性則是病人能否承受該手術。評估時兩者都需要交代。</p></aside>"]}, {"id": "immunotherapy", "title": "術前與圍手術期免疫治療", "subtitle": "比較方法、分析族群與結果", "pages": ["<p>術前研究在病人尚未接受手術時分組，因此「沒有走到手術」也是整套策略的結果。圍手術期研究通常在術前一次隨機決定術前與術後療程；其效果代表整套策略，無法直接拆出術後追加免疫治療本身的貢獻。 <span class=\"cites\"><a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-kn671\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析\">[3]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"術前／圍手術期免疫試驗的設計比較\"><table><caption>表 2．術前／圍手術期免疫試驗的設計比較</caption><thead><tr><th scope=\"col\">試驗與設計</th><th scope=\"col\">族群／TNM 版本</th><th scope=\"col\">隨機人數</th><th scope=\"col\">研究療程與主要終點</th></tr></thead><tbody><tr><th scope=\"row\">CheckMate 816<br>第三期、開放、1:1<br>NCT02998528</th><td>可切除 IB（≥4 cm）–IIIA；第七版；排除已知敏感 EGFR／ALK</td><td>共358人；nivolumab＋化療組：179人；化療組：179人</td><td>術前：nivolumab 加含鉑雙藥化療，或單獨同樣的化療，每 3 週一次共 3 週期（化療依組織型：非鱗狀用 cisplatin 或 carboplatin 加 pemetrexed，鱗狀用 cisplatin 加 gemcitabine，任何組織型可用 carboplatin 加 paclitaxel） → 手術；術後不規定免疫治療。共同主要終點：pCR 與 EFS。</td></tr><tr><th scope=\"row\">KEYNOTE-671<br>第三期、雙盲、1:1<br>NCT03425643</th><td>可切除 II–IIIB(N2)；第八版</td><td>共797人；pembrolizumab組：397人；安慰劑組：400人</td><td>術前：pembrolizumab 或安慰劑，各加 cisplatin 雙藥化療（非鱗狀加 pemetrexed，鱗狀加 gemcitabine），每 3 週一次共 4 週期 → 手術 → 術後：依原分組續用 pembrolizumab 或安慰劑（不再加化療），每 3 週一次最多 13 週期。共同主要終點：EFS 與 OS。</td></tr><tr><th scope=\"row\">AEGEAN<br>第三期、雙盲、1:1<br>NCT03800134</th><td>可切除 II–IIIB(N2)；第八版</td><td>隨機共802人：durvalumab組400人、安慰劑組402人；主要療效mITT共740人：durvalumab組366人、安慰劑組374人</td><td>術前：durvalumab 或安慰劑，各加含鉑雙藥化療（cisplatin 或 carboplatin；非鱗狀加 pemetrexed，鱗狀加 gemcitabine 或 paclitaxel），每 3 週一次共 4 週期 → 手術 → 術後：依原分組續用 durvalumab 或安慰劑，每 4 週一次共 12 次。共同主要終點：pCR 與 EFS。</td></tr><tr><th scope=\"row\">CheckMate 77T<br>第三期、雙盲、1:1<br>NCT04025879</th><td>可切除 IIA–IIIB；第八版；排除 EGFR／ALK</td><td>共461人；nivolumab組：229人；安慰劑組：232人</td><td>術前：nivolumab 或安慰劑，各加含鉑雙藥化療（搭配藥依組織型選擇，見原文），每 3 週一次共 4 週期 → 手術 → 術後：依原分組續用 nivolumab 或安慰劑，每 4 週一次，最長 1 年。主要終點：EFS。</td></tr><tr><th scope=\"row\">RATIONALE-315<br>第三期、雙盲、1:1<br>NCT04379635</th><td>中國；可切除 II–IIIA；第八版</td><td>共453人；tislelizumab組：226人；安慰劑組：227人</td><td>術前：tislelizumab 200 mg 或安慰劑，各加含鉑雙藥化療（搭配藥依組織型選擇，見原文），每 3 週一次共 3–4 週期 → 手術 → 術後：依原分組續用 tislelizumab 400 mg 或安慰劑，每 6 週一次最多 8 次。共同主要終點：MPR 與 EFS。</td></tr><tr><th scope=\"row\">Neotorch<br>第三期、雙盲、1:1<br>NCT04158440</th><td>中國；可切除 II–III；第八版；本表結果為 III 期</td><td>全試驗501人；本版III期分析404人：toripalimab組202人、安慰劑組202人</td><td>toripalimab 或安慰劑加含鉑雙藥化療（鱗狀：cisplatin 或 carboplatin 加 paclitaxel；非鱗狀：加 pemetrexed）：術前 3 週期 → 手術 → 術後再 1 週期，之後依原分組續用 toripalimab 或安慰劑（不再加化療）最多 13 次。共同主要終點：MPR 與 EFS。</td></tr><tr><th scope=\"row\">NADIM II<br>第二期、開放、2:1<br>NCT03838159</th><td>可切除 IIIA–IIIB；第八版；ECOG 0–1</td><td>共86人；nivolumab＋化療組：57人；化療組：29人</td><td>術前：nivolumab 加 carboplatin／paclitaxel，或單獨化療，共 3 週期 → 手術；nivolumab 組達 R0 切除後續用 nivolumab 6 個月，化療組不給。主要終點：pCR。</td></tr></tbody></table></div><p class=\"table-note\">各組人數直接標註組名。mITT 為修正版意向治療分析；AEGEAN 排除62名已知 EGFR／ALK 變異者後，療效分母為durvalumab組366人、安慰劑組374人。不同試驗對驅動基因的規定不完全相同，不能把整張表統稱為排除所有 driver 的研究。 <span class=\"cites\"><a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-kn671\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析\">[3]</a> <a href=\"#ref-aegean\" aria-label=\"參考文獻：AEGEAN：Heymach et al., NEJM 2023\">[6]</a> <a href=\"#ref-cm77t\" aria-label=\"參考文獻：CheckMate 77T：Cascone et al., NEJM 2024\">[7]</a> <a href=\"#ref-r315\" aria-label=\"參考文獻：RATIONALE-315：Wang et al., Annals of Oncology 2026，最終分析\">[8]</a> <a href=\"#ref-r315method\" aria-label=\"參考文獻：RATIONALE-315：ASCO 2026，研究療程與外科探索性分析\">[9]</a> <a href=\"#ref-neotorch\" aria-label=\"參考文獻：Neotorch：Lu et al., JAMA 2024，第三期疾病中期分析\">[10]</a> <a href=\"#ref-nadim2\" aria-label=\"參考文獻：NADIM II：Provencio et al., NEJM 2023\">[11]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"免疫治療的療效：同時保留時間點與分析版本\"><table><caption>表 3．免疫治療的療效：同時保留時間點與分析版本</caption><thead><tr><th scope=\"col\">試驗／報告版本</th><th scope=\"col\">病理反應</th><th scope=\"col\">事件或存活結果</th><th scope=\"col\">閱讀要點</th></tr></thead><tbody><tr><th scope=\"row\">CheckMate 816<br>2022；2025 OS</th><td>pCR 24.0% vs 2.2%</td><td>2022 EFS HR 0.63（97.38% CI 0.43–0.91）；2025 五年 OS 65.4% vs 55.0%；OS HR 0.72（95% CI 0.523–0.998），p=0.048</td><td>2025中位追蹤68.4月；未規定術後免疫療程。</td></tr><tr><th scope=\"row\">KEYNOTE-671<br>2026 五年追蹤</th><td>2023 pCR 18.1% vs 4.0%</td><td>五年 EFS 49.9% vs 26.5%；HR 0.58（95% CI 0.48–0.69）。五年 OS 64.6% vs 53.6%；HR 0.74（0.59–0.92）</td><td>截止2025/7/3；隨機至截止時間中位60.4月。</td></tr><tr><th scope=\"row\">AEGEAN<br>2023主要分析</th><td>pCR 17.2% vs 4.3%</td><td>EFS HR 0.68（95% CI 0.53–0.88）；12月 EFS 73.4% vs 64.5%</td><td>療效為740人 mITT；pCR 與 EFS 分析成熟度不同。</td></tr><tr><th scope=\"row\">CheckMate 77T<br>2024中期分析</th><td>pCR 25.3% vs 4.7%</td><td>18月 EFS 70.2% vs 50.0%；HR 0.58（97.36% CI 0.42–0.81）</td><td>中位追蹤25.4月；此版本不能寫成已確立 OS 獲益。</td></tr><tr><th scope=\"row\">RATIONALE-315<br>2026最終分析</th><td>中期分析（ESMO 2023 報告，Lancet Respir Med 2025 發表）：MPR 56%（95% CI 50–63）vs 15%（11–20），差41%（33–49）</td><td>36月 OS 79.3% vs 69.3%；OS HR 0.65（95% CI 0.45–0.93），p=0.009；EFS HR 0.58（0.43–0.79）</td><td>中位追蹤38.5月；採最終分析，不沿用早期 EFS HR。</td></tr><tr><th scope=\"row\">Neotorch<br>2024中期分析，III期</th><td>MPR 48.5% vs 8.4%；pCR 24.8% vs 1.0%</td><td>EFS HR 0.40（95% CI 0.28–0.57）</td><td>中位追蹤18.3月；此列不能外推為全部501人結果。</td></tr><tr><th scope=\"row\">NADIM II<br>2023第二期結果</th><td>pCR 37% vs 7%</td><td>24月 PFS 67.2% vs 40.9%；HR 0.47（95% CI 0.25–0.88）</td><td>小型隨機第二期；不要和358人的 CheckMate 816 混同。</td></tr></tbody></table></div><p class=\"table-note\">pCR＝病理完全反應；MPR＝主要病理反應；EFS＝無事件存活；PFS＝無惡化存活；OS＝整體存活；HR＝風險比。不同研究不是頭對頭比較。 <span class=\"cites\"><a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-cm816os\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2025，最終 OS 分析\">[2]</a> <a href=\"#ref-kn671\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析\">[3]</a> <a href=\"#ref-kn671five\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., Annals of Oncology 2026，五年追蹤\">[5]</a> <a href=\"#ref-aegean\" aria-label=\"參考文獻：AEGEAN：Heymach et al., NEJM 2023\">[6]</a> <a href=\"#ref-cm77t\" aria-label=\"參考文獻：CheckMate 77T：Cascone et al., NEJM 2024\">[7]</a> <a href=\"#ref-r315\" aria-label=\"參考文獻：RATIONALE-315：Wang et al., Annals of Oncology 2026，最終分析\">[8]</a> <a href=\"#ref-neotorch\" aria-label=\"參考文獻：Neotorch：Lu et al., JAMA 2024，第三期疾病中期分析\">[10]</a> <a href=\"#ref-nadim2\" aria-label=\"參考文獻：NADIM II：Provencio et al., NEJM 2023\">[11]</a> <a href=\"#ref-r315primary\" aria-label=\"參考文獻：RATIONALE-315：Yue et al., Lancet Respiratory Medicine 2025，中期分析（MPR 與首次 EFS）\">[51]</a></span></p>", "<p>KEYNOTE-671 的第二次中期分析已達預先配置的 OS 顯著性門檻：OS HR 0.72（95% CI 0.56–0.93），單側 p=0.0052，門檻0.0054。五年追蹤則描述效益的持續性；不要把後續報告的每個數值都當成新的、獨立的顯著性檢定。 <span class=\"cites\"><a href=\"#ref-kn671os\" aria-label=\"參考文獻：KEYNOTE-671：Spicer et al., Lancet 2024，第二次中期分析\">[4]</a> <a href=\"#ref-kn671five\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., Annals of Oncology 2026，五年追蹤\">[5]</a></span></p><p>CheckMate 816 的 EFS 由盲性獨立中央審查評估；KEYNOTE-671 的 EFS 由研究者評估。AEGEAN 與 CheckMate 77T 使用盲性獨立中央審查。EFS 涵蓋手術前惡化、妨礙或取消手術的事件、後續復發或死亡，但各計畫的具體事件判定並非完全一致。 <span class=\"cites\"><a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-kn671\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析\">[3]</a> <a href=\"#ref-aegean\" aria-label=\"參考文獻：AEGEAN：Heymach et al., NEJM 2023\">[6]</a> <a href=\"#ref-cm77t\" aria-label=\"參考文獻：CheckMate 77T：Cascone et al., NEJM 2024\">[7]</a></span></p>", "<aside class=\"callout\"><strong>最容易過度解讀的地方</strong><p>CheckMate 816 與 CheckMate 77T 的病人不是在同一試驗中被分派到「術後繼續」或「術後不給」nivolumab。即使限制在達 pCR、完成手術或開始術後治療的人，仍有隨機化後選擇與跨研究差異；不能用這些比較宣告術後治療一定必要或一定可省。</p></aside>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"IMpower030：未達主要 EFS 終點\"><table><caption>表 4．IMpower030：未達主要 EFS 終點</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>可切除 II–IIIB（T3N2），ECOG 0–1；主要族群為 IIB–IIIB、EGFR／ALK野生型（WT）。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>第三期隨機研究。ITT-WT：atezolizumab組219人、對照組221人；主要 IIB–IIIB WT：atezolizumab組196人、對照組201人。</td></tr><tr><th scope=\"row\">介入與對照</th><td>術前：atezolizumab 1200 mg 或安慰劑，每 3 週一次，各加含鉑雙藥化療 4 週期（cisplatin 或 carboplatin；非鱗狀加 pemetrexed，鱗狀加 nab-paclitaxel 或 gemcitabine）；手術後atezolizumab16週期，對最佳支持照護。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要獨立審查無事件存活（EFS）；主要族群先檢定，通過後才能依階層檢定其他族群／終點。</td></tr><tr><th scope=\"row\">結果與版本</th><td>WCLC2026最終分析（資料截止2025/10/1），中位追蹤69.3月。主要族群中位EFS：atezolizumab組62.8月、對照組34.9月，HR 0.77（95% CI 0.58–1.02），p=0.07，未達預設p≤0.0402。主要族群pCR：58/196（29.6%）對17/201（8.5%）。另ITT-WT EFS：67.2月對43.9月，HR 0.75（0.57–0.98）。</td></tr><tr><th scope=\"row\">如何解讀</th><td>主要族群未達顯著，ITT-WT與次要終點不可視為通過正式檢定；不同族群的病理反應率不能混用。這是清單中必須保留的陰性圍手術期第三期研究。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT03456063\">NCT03456063</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-im030\" aria-label=\"參考文獻：IMpower030：Solomon，WCLC2026 OA04.03 原始報告，第6、8、10頁\">[43]</a> <a href=\"#ref-im030reg\" aria-label=\"參考文獻：IMpower030：ClinicalTrials.gov，NCT03456063\">[44]</a></span></p>", "<p>Neotorch於2026年5月公告最終分析達預設EFS／MPR界值；公告未提供完整HR與信賴區間，因此本頁仍將可核實的精確數字標為2024年、404名III期受試者的期中分析，不當成全501人的最終結果。 <span class=\"cites\"><a href=\"#ref-neotorchfinal\" aria-label=\"參考文獻：Neotorch：研究贊助者2026年5月26日最終分析公告\">[49]</a></span></p>"]}, {"id": "surgery", "title": "手術完成度與治療代價", "subtitle": "分清手術率、切緣、併發症與藥物毒性", "pages": ["<p>病理反應值得看，能否完成根治性手術及療程毒性也必須一起看。手術率應以隨機分派者為分母；R0率則常以已接受手術者為分母，兩者不能直接並列成同一種成功率。</p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"手術與安全性數據的正確讀法\"><table><caption>表 5．手術與安全性數據的正確讀法</caption><thead><tr><th scope=\"col\">研究／版本</th><th scope=\"col\">結果</th><th scope=\"col\">分母與事件定義</th></tr></thead><tbody><tr><th scope=\"row\">CheckMate 816，2022</th><td>手術完成83.2% vs 75.4%；第3–4級治療相關不良事件33.5% vs 36.9%</td><td>手術率以各179名隨機受試者計；安全性以實際接受治療者計。</td></tr><tr><th scope=\"row\">KEYNOTE-671，2023</th><td>接受手術82.1% vs 79.4%；第3級以上治療相關不良事件44.9% vs 37.3%</td><td>手術率以397／400名隨機者為分母；安全性以接受治療者計。</td></tr><tr><th scope=\"row\">CheckMate 77T，2024</th><td>根治手術78% vs 77%；第3–4級治療相關不良事件32.5% vs 25.2%</td><td>全療程治療相關事件；不是單純手術併發症。</td></tr><tr><th scope=\"row\">AEGEAN，2023</th><td>最高第3–4級不良事件42.4% vs 43.2%</td><td>此處是任何原因的不良事件，不能與 CheckMate 816、KEYNOTE-671、CheckMate 77T 的治療相關不良事件直接比較高低。</td></tr><tr><th scope=\"row\">NADIM II，2023</th><td>接受手術93% vs 69%</td><td>以nivolumab＋化療組57人、化療組29名隨機分派者為起點；不能只描述已成功切除者。</td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-kn671\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析\">[3]</a> <a href=\"#ref-aegean\" aria-label=\"參考文獻：AEGEAN：Heymach et al., NEJM 2023\">[6]</a> <a href=\"#ref-cm77t\" aria-label=\"參考文獻：CheckMate 77T：Cascone et al., NEJM 2024\">[7]</a> <a href=\"#ref-nadim2\" aria-label=\"參考文獻：NADIM II：Provencio et al., NEJM 2023\">[11]</a></span></p>", "<p>在外科規劃上，腫瘤縮小不保證解剖平面恢復。肺門淋巴結與肺動脈周圍的纖維化、原有血管或支氣管侵犯、預期切除範圍及術後肺功能，都可能比腫瘤直徑更影響手術。研究回報整體可行，並不表示每台手術都容易。</p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"誘導治療前後的外科評估\"><table><caption>表 6．誘導治療前後的外科評估</caption><thead><tr><th scope=\"col\">時間點</th><th scope=\"col\">應交代的內容</th><th scope=\"col\">對決策的影響</th></tr></thead><tbody><tr><th scope=\"row\">治療前</th><td>縱膈與遠端分期、病理／分子結果、預計切除範圍、心肺功能、病人意願</td><td>先定義能否達成完整切除，以及若反應不足時的根治替代方案。</td></tr><tr><th scope=\"row\">治療後再評估</th><td>胸部影像、可疑新病灶、血管／支氣管關係，必要時對會改變路徑的病灶取樣</td><td>找出進展、釐清可能的免疫性淋巴結反應，重新規劃切除或化放療。</td></tr><tr><th scope=\"row\">手術與病理</th><td>切緣、淋巴結站別與陽性數、殘存腫瘤比例、ypTNM</td><td>確認 pCR／MPR、完整切除程度與殘存風險，供術後討論。</td></tr><tr><th scope=\"row\">術後研究報告</th><td>30／90天死亡、併發症分級、手術延遲或取消、能否開始術後治療</td><td>以一致定義呈現整條路徑，避免只報 R0 或微創成功率。</td></tr></tbody></table></div><p class=\"table-note\">此表為臨床閱讀整理；個別檢查與手術範圍需由多專科團隊評估。 <span class=\"cites\"><a href=\"#ref-pathology\" aria-label=\"參考文獻：IASLC：2020 術前治療後切除檢體病理評估建議\">[41]</a> <a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-kn671\" aria-label=\"參考文獻：KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析\">[3]</a> <a href=\"#ref-bridge\" aria-label=\"參考文獻：MDT-BRIDGE：2024 研究設計論文\">[34]</a></span></p>"]}, {"id": "neoadjuvant-targeted", "title": "術前標靶治療", "subtitle": "EGFR 與 ALK 的病理終點和長期結果", "pages": ["<p>驅動基因陽性疾病的術前研究，首先要分清「病理反應改善」與「已證實長期存活改善」。酪胺酸激酶抑制劑（tyrosine kinase inhibitor, TKI）可能在仍有存活細胞的情況下抑制腫瘤；不能套用另一類藥物的 pCR 大小來決定療效高低。 <span class=\"cites\"><a href=\"#ref-neoadaura\" aria-label=\"參考文獻：NeoADAURA：He et al., JCO 2025，主要分析\">[12]</a> <a href=\"#ref-pathology\" aria-label=\"參考文獻：IASLC：2020 術前治療後切除檢體病理評估建議\">[41]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"NeoADAURA：三臂隨機比較\"><table><caption>表 7．NeoADAURA：三臂隨機比較</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>可切除、第八版 II–IIIB(N2)非鱗狀 NSCLC；EGFR exon 19 deletion（Ex19del）或 L858R。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>全球第三期，1:1:1隨機；358人。osimertinib＋化療121人、osimertinib單藥117人、安慰劑＋化療120人。</td></tr><tr><th scope=\"row\">介入與對照</th><td>osimertinib 80 mg每日一次，術前至少9週；含鉑化療（cisplatin 或 carboplatin 加 pemetrexed）每 3 週一次，共 3 週期。手術後各組適合者均可接受輔助 osimertinib。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要終點：盲性獨立中央病理審查 MPR；研究定義包含原發腫瘤床存活腫瘤≤10%及 R0切除。未手術或不能評估者按未反應處理。EFS依預設階層檢定。</td></tr><tr><th scope=\"row\">結果與版本</th><td>2025主要分析：三組MPR約26%、25%、2%。EFS成熟度15%；合併組對化療 HR 0.50（99.8% CI 0.17–1.41），p=0.04，未達預設0.002門檻。</td></tr><tr><th scope=\"row\">如何解讀</th><td>這是共同可使用術後 osimertinib 條件下，不同術前策略的比較。兩個標靶組MPR接近，未證明 osimertinib 單獨使用對合併化療非劣效；也沒有證明可以省略術後治療。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT04351555\">NCT04351555</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-neoadaura\" aria-label=\"參考文獻：NeoADAURA：He et al., JCO 2025，主要分析\">[12]</a> <a href=\"#ref-neoadauradesign\" aria-label=\"參考文獻：NeoADAURA：2021 研究設計論文\">[13]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"術前 ALK 標靶研究：設計與適用範圍\"><table><caption>表 8．術前 ALK 標靶研究：設計與適用範圍</caption><thead><tr><th scope=\"col\">研究</th><th scope=\"col\">研究情境與設計</th><th scope=\"col\">治療與終點</th><th scope=\"col\">能回答到哪裡</th></tr></thead><tbody><tr><th scope=\"row\">ALNEO<br>NCT05015010<br>EudraCT 2020-003432-25</th><td>多中心、開放、單臂第二期；潛在可切除第 III 期 ALK陽性</td><td>alectinib 600 mg每日兩次，術前8週 → 手術 → 術後96週；主要MPR，2025報告採盲性獨立中央審查</td><td>提供病理反應與可行性證據；缺乏隨機化療對照。</td></tr><tr><th scope=\"row\">NAUTIKA1<br>NCT04302025</th><td>多中心第二期 umbrella；依分子變異分組，ALK cohort為單臂</td><td>ALK 隊列方案：alectinib術前8週 → 手術 → 可給含鉑化療最多4週期 → 輔助alectinib。主要MPR</td><td>須按cohort與資料版本讀取分期、人數、病理評估及術後暴露。</td></tr><tr><th scope=\"row\">LORIN<br>NCT05740943</th><td>多中心、前瞻、開放第二期；Simon兩階段設計；第 III 期 ALK融合</td><td>術前lorlatinib 3週期；以病理反應為核心評估。2026摘要43人：19人潛在可切除、24人不可切除；32人手術</td><td>混合不同起始可切除性，且手術者經反應篩選；不能拿手術者的pCR與一般可切除隨機試驗直接比較。</td></tr></tbody></table></div><p class=\"table-note\">本表以已核實的設計與資料範圍為主。ALNEO、NAUTIKA1與LORIN並非彼此頭對頭比較，也不能由各自pCR推定哪個ALK藥物最優。 <span class=\"cites\"><a href=\"#ref-alneo\" aria-label=\"參考文獻：ALNEO：2021 研究設計\">[20]</a> <a href=\"#ref-alneofinal\" aria-label=\"參考文獻：ALNEO：ASCO 2025 abstract 8015，最終分析\">[21]</a> <a href=\"#ref-nautika\" aria-label=\"參考文獻：NAUTIKA1：ClinicalTrials.gov，NCT04302025\">[22]</a> <a href=\"#ref-nautikadesign\" aria-label=\"參考文獻：NAUTIKA1：2022 ALK cohort 研究方法與初期分析\">[23]</a> <a href=\"#ref-lorin\" aria-label=\"參考文獻：LORIN：ASCO 2026 abstract 8002\">[24]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"LORIN：2026 年療效與手術結果\"><table><caption>表 9．LORIN：2026 年療效與手術結果</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>第 III 期 ALK 融合陽性 NSCLC；起始潛在可切除19人、不可切除24人。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>開放、多中心、前瞻性單臂第二期；lorlatinib組：43人，未隨機分派。Simon兩階段：pCR虛無假說≤20%、對立假說≥40%，α=0.05、β=0.20，43人中至少12例pCR。</td></tr><tr><th scope=\"row\">介入與對照</th><td>最多3週期lorlatinib後評估局部治療；鞏固lorlatinib最長2年。截止2026/1/1，43人皆完成3週期：手術32人、續TKI 9人、放療2人。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要pCR；次要MPR、EFS、OS與安全性。全體43人與手術者32人的分母分開呈現。</td></tr><tr><th scope=\"row\">結果與版本</th><td>ORR 36/43（83.7%），無PD；手術者pCR 15/32（46.9%）、MPR 26/32（81.3%）、R0 31/32（96.9%），3人轉開胸，淋巴結降期29/32（90.6%）。初始不可切除者18/24（75%）完成轉換手術。中位追蹤13月；一年EFS 97.1%（95% CI 91.5–100），無OS事件。常見治療相關不良事件為高三酸甘油酯血症、高膽固醇血症與水腫，摘要未列比例或分級。</td></tr><tr><th scope=\"row\">如何解讀</th><td>單臂會議摘要；46.9%是32名手術者的pCR，不是全43人。3例局部復發皆初始N3且術後未接受lorlatinib，不能據此證明停藥導致復發。未見OS事件不等於已證實存活獲益。ORR＝客觀反應率；PD＝疾病惡化。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT05740943\">NCT05740943</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-lorin\" aria-label=\"參考文獻：LORIN：ASCO 2026 abstract 8002\">[24]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"ALNEO：單臂第二期最終分析\"><table><caption>表 10．ALNEO：單臂第二期最終分析</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>未接受治療、潛在可切除第III期ALK陽性，ECOG≤1；義大利20中心。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>單臂、開放第二期；alectinib組：33人。Simon兩階段設計以MPR 20%對40%規劃。</td></tr><tr><th scope=\"row\">介入與對照</th><td>alectinib術前8週 → 手術 → 術後96週。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要MPR由盲性獨立中央審查評估；次要pCR、影像反應、EFS、DFS、OS與安全性。</td></tr><tr><th scope=\"row\">結果與版本</th><td>ASCO2025：33人完成術前治療，28人手術，24/28達R0；以全33人計MPR 15/33（45.5%，90% CI 31–61）、pCR 4/33（12%，95% CI 3–28）。26人開始輔助治療；中位追蹤15.2月，EFS與OS中位數未達；6人惡化／復發。術前第3級以上不良事件3人（9%），術後2人（8%）。</td></tr><tr><th scope=\"row\">如何解讀</th><td>33名收案者、28名手術者與26名術後用藥者是不同分母。單臂病理反應可支持進一步研究，不能證明較化療或其他ALK抑制劑延長存活。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT05015010\">NCT05015010</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-alneofinal\" aria-label=\"參考文獻：ALNEO：ASCO 2025 abstract 8015，最終分析\">[21]</a> <a href=\"#ref-alneo\" aria-label=\"參考文獻：ALNEO：2021 研究設計\">[20]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"NAUTIKA1：ALK cohort 2026 主要分析\"><table><caption>表 11．NAUTIKA1：ALK cohort 2026 主要分析</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>第八版IB–IIIA及IIIB（僅T3N2），ALK陽性、可達R0切除。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>Umbrella第二期的單臂ALK cohort：alectinib組收案48人，合格／療效分析45人、手術42人、病理反應分析43人。</td></tr><tr><th scope=\"row\">介入與對照</th><td>alectinib 600 mg每日兩次、術前8週 → 手術 → 含鉑雙藥化療最多 4 週期（搭配藥依組織型選擇；禁忌或拒絕可免）→ alectinib最長2年。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要MPR由當地評估（≤10%存活腫瘤）；病理分析另納入因不良事件或疾病惡化停療者；未R0切除按未達MPR處理。</td></tr><tr><th scope=\"row\">結果與版本</th><td>2026/6/30截止：MPR 24/43（56%，95% CI 40–71）、pCR 8/43（19%，8–33）；ORR 27/45（60%，44–74），皆部分反應、未確認。42人手術，40人R0。中位追蹤23月：2年EFS 90%（81–99，n=45）、DFS 97%（91–100，n=39）、OS 98%（93–100，n=45）。術前安全族群48人：第3–4級治療相關不良事件3人（6%）、停藥3人（6%）；術後33人：第3–4級治療相關不良事件3人（9%）、停藥4人（12%）。</td></tr><tr><th scope=\"row\">如何解讀</th><td>43名病理分析者（含因不良事件或惡化停療者）與42名手術者是不同分母。DFS分母39人不能替代全體EFS分母45人；單臂早期存活估計不能證明比較療效。採官方更新版，未混用較早摘要截止日數字。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT04302025\">NCT04302025</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-nautika2026\" aria-label=\"參考文獻：NAUTIKA1：WCLC2026 官方主要分析，2026/6/30截止\">[50]</a></span></p><p>同一 umbrella 研究的 KRAS G12C 隊列（divarasib 400 mg 每日一次，術前8週）於 WCLC 2026 更新：20人收案、19人手術且皆為R0；MPR 8/19（42%）、pCR 3/19（16%）、ORR 55%；中位追蹤14.8月。主要終點是安全性與可行性，分母只有19–20人，不能與 ALK 隊列或免疫化療試驗並列比較。 <span class=\"cites\"><a href=\"#ref-nautikakras\" aria-label=\"參考文獻：NAUTIKA1：Chaft et al., WCLC 2026 OA04.04，KRAS G12C 隊列（divarasib）更新，2026/6/30 截止\">[53]</a></span></p>"]}, {"id": "adjuvant-targeted", "title": "術後標靶與長期追蹤", "subtitle": "ADAURA、ALINA、LIBRETTO-432", "pages": ["<p>術後標靶試驗從已接受根治性局部治療的病人出發。ADAURA與LIBRETTO-432的對照是安慰劑；ALINA的對照是含鉑化療。這個差異決定了每項研究究竟回答「加藥」還是「替換術後策略」。 <span class=\"cites\"><a href=\"#ref-adaura\" aria-label=\"參考文獻：ADAURA：Tsuboi et al., NEJM 2023，計畫性最終 OS 分析\">[14]</a> <a href=\"#ref-alina\" aria-label=\"參考文獻：ALINA：Wu et al., NEJM 2024\">[17]</a> <a href=\"#ref-librettoabstract\" aria-label=\"參考文獻：LIBRETTO-432：ASCO 2026 LBA3，主要結果\">[19]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"術後標靶試驗：方法與療程\"><table><caption>表 12．術後標靶試驗：方法與療程</caption><thead><tr><th scope=\"col\">試驗</th><th scope=\"col\">納入族群／人數</th><th scope=\"col\">設計與介入</th><th scope=\"col\">主要終點及方法重點</th></tr></thead><tbody><tr><th scope=\"row\">ADAURA<br>NCT02511106</th><td>完整切除，第七版IB–IIIA，EGFR Ex19del／L858R；共682人；osimertinib組：339人；安慰劑組：343人</td><td>第三期、雙盲、1:1；osimertinib 80 mg 每日一次最多 3 年，與安慰劑比較</td><td>主要終點：II–IIIA 期（470 人）的 DFS；OS 為關鍵次要終點。隨機前可先完成術後化療，化療本身不隨機。</td></tr><tr><th scope=\"row\">ALINA<br>NCT03456076</th><td>完整切除，第七版IB（≥4 cm）–IIIA，ALK陽性；共257人；alectinib組：130人；含鉑化療組：127人</td><td>第三期、開放、1:1；alectinib 600 mg 每日兩次共 2 年，與含鉑化療 4 週期（cisplatin 加 pemetrexed、gemcitabine 或 vinorelbine；不耐受 cisplatin 者可用 carboplatin）比較（兩組治療完全不同，不是都先化療再加藥）</td><td>主要終點：DFS，先檢定 II–IIIA 期、再檢定全體族群（階層檢定）。</td></tr><tr><th scope=\"row\">LIBRETTO-432<br>NCT04819100</th><td>根治性局部治療後，第八版 IB–IIIA RET融合陽性；共151人；selpercatinib組：75人；安慰劑組：76人；主要II–IIIA族群109人</td><td>第三期、雙盲、1:1；selpercatinib 最多 3 年，與安慰劑比較；ASCO 摘要列劑量 160 mg 每日兩次</td><td>主要終點：II–IIIA 期的 EFS（研究者評估）；安慰劑組復發後允許交叉使用 selpercatinib。完整劑量及體重條件須依protocol。</td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-adaura\" aria-label=\"參考文獻：ADAURA：Tsuboi et al., NEJM 2023，計畫性最終 OS 分析\">[14]</a> <a href=\"#ref-alina\" aria-label=\"參考文獻：ALINA：Wu et al., NEJM 2024\">[17]</a> <a href=\"#ref-librettoabstract\" aria-label=\"參考文獻：LIBRETTO-432：ASCO 2026 LBA3，主要結果\">[19]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"術後標靶試驗：族群、結果與成熟度\"><table><caption>表 13．術後標靶試驗：族群、結果與成熟度</caption><thead><tr><th scope=\"col\">試驗／版本</th><th scope=\"col\">分析族群</th><th scope=\"col\">主要數據</th><th scope=\"col\">限制</th></tr></thead><tbody><tr><th scope=\"row\">ADAURA<br>2023計畫性最終OS</th><td>II–IIIA</td><td>五年OS 85% vs 73%；HR 0.49（95.03% CI 0.33–0.73）</td><td>化療沒有隨機分派；不能證明省略化療等效。</td></tr><tr><th scope=\"row\">ADAURA<br>2026八年探索性更新</th><td>II–IIIA；osimertinib組：233人；安慰劑組：237人</td><td>八年OS 74%（95% CI 67–80）vs 58%（50–65）；HR 0.53（0.38–0.75）；絕對差16個百分點</td><td>截止2026/5/4；延伸OS追蹤，不是八年連續用藥。</td></tr><tr><th scope=\"row\">ADAURA<br>同次更新</th><td>全體IB–IIIA；osimertinib組：339人；安慰劑組：343人</td><td>八年OS 79%（95% CI 74–83）vs 64%（58–70）；HR 0.52（0.39–0.71）；絕對差15個百分點</td><td>不可將主要族群74%／58%誤寫成全體結果。</td></tr><tr><th scope=\"row\">ALINA<br>2024主要分析</th><td>II–IIIA</td><td>兩年DFS 93.8% vs 63.0%；HR 0.24（95% CI 0.13–0.45）</td><td>此版本OS尚未成熟；DFS獲益不能直接改寫為已證實OS。</td></tr><tr><th scope=\"row\">LIBRETTO-432<br>ASCO 2026主要分析</th><td>II–IIIA，109人</td><td>兩年EFS 91.5% vs 61.1%；HR 0.172（95% CI 0.058–0.509）；p=0.0003；EFS事件4 vs 19</td><td>中位追蹤 24 月（selpercatinib 組）／27 月（安慰劑組）。全體151人（IB–IIIA，次要終點）：兩年EFS 94% vs 70%，HR 0.16（95% CI 0.06–0.48）；與主要族群的109人分母不能混用。</td></tr></tbody></table></div><p class=\"table-note\">LIBRETTO-432主文將兩年EFS四捨五入為92%／61%；此表保留ASCO摘要精度，避免將不同族群或四捨五入差異混成資料衝突。 <span class=\"cites\"><a href=\"#ref-adaura\" aria-label=\"參考文獻：ADAURA：Tsuboi et al., NEJM 2023，計畫性最終 OS 分析\">[14]</a> <a href=\"#ref-adaura8\" aria-label=\"參考文獻：ADAURA：IASLC／ILCN 2026，八年 OS 更新\">[15]</a> <a href=\"#ref-adaura8data\" aria-label=\"參考文獻：ADAURA：2026 年 9 月 14 日研究贊助者公開數據表與追蹤註記\">[16]</a> <a href=\"#ref-alina\" aria-label=\"參考文獻：ALINA：Wu et al., NEJM 2024\">[17]</a> <a href=\"#ref-libretto\" aria-label=\"參考文獻：LIBRETTO-432：Wu et al., NEJM 2026\">[18]</a> <a href=\"#ref-librettoabstract\" aria-label=\"參考文獻：LIBRETTO-432：ASCO 2026 LBA3，主要結果\">[19]</a></span></p>", "<p>ADAURA八年更新有127人未取得新增存活資料，保留在分析中並沿用既有設限時間。這些受試者不能視為已確認存活至八年；曲線長期估計仍受追蹤完整度影響。三年療程後仍見OS差異，是長期策略效益的證據，尚未回答每位病人是否需要延長療程。 <span class=\"cites\"><a href=\"#ref-adaura8data\" aria-label=\"參考文獻：ADAURA：2026 年 9 月 14 日研究贊助者公開數據表與追蹤註記\">[16]</a></span></p><p>LIBRETTO-432的常見毒性包括肝酵素上升；NEJM報告selpercatinib組第3級以上ALT、AST升高分別17%、19%。閱讀早期疾病治療時，需把復發風險降低和數年用藥的耐受性一起考量。 <span class=\"cites\"><a href=\"#ref-libretto\" aria-label=\"參考文獻：LIBRETTO-432：Wu et al., NEJM 2026\">[18]</a></span></p><p>WCLC 2026 另報告一項研究者發起的韓國第三期試驗 RAPHAEL：完整切除的第八版 pII–IIIB、EGFR Ex19del／L858R 非鱗狀肺癌193人，隨機比較 pemetrexed／cisplatin 四週期內間歇給 gefitinib 與 vinorelbine／cisplatin；中位DFS 58.8 vs 41.9月（p=0.036），差異集中在第III期與 Ex19del。這是第一代 TKI、短期暴露的設計，未提供 HR、尚未發表；它回答的是「化療期間加入 TKI」而不是 ADAURA 的三年維持，兩者不能互相換算。 <span class=\"cites\"><a href=\"#ref-raphael\" aria-label=\"參考文獻：RAPHAEL（KM-07／LU15-12）：Ahn et al., WCLC 2026 OA04.01，隨機第三期會議報告，尚未正式發表\">[54]</a></span></p>"]}, {"id": "adjuvant-io", "title": "術後免疫治療的對照問題", "subtitle": "先做手術的試驗，另有隨機分派與檢定條件", "pages": ["<p>已完成手術的病人，還有以術後免疫治療為問題的獨立研究。這些試驗的隨機分派時間、先前化療與基因族群，都不同於術前免疫研究。以下保留最初報告的版本，以說明研究設計；兩項試驗在 2025 年都有 DFS／OS 更新，本章未收錄。 <span class=\"cites\"><a href=\"#ref-im010\" aria-label=\"參考文獻：IMpower010：Felip et al., Lancet 2021\">[25]</a> <a href=\"#ref-kn091\" aria-label=\"參考文獻：PEARLS／KEYNOTE-091：O’Brien et al., Lancet Oncology 2022\">[26]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"術後免疫治療的兩種研究設計\"><table><caption>表 14．術後免疫治療的兩種研究設計</caption><thead><tr><th scope=\"col\">試驗</th><th scope=\"col\">研究情境與設計</th><th scope=\"col\">療程／主要終點</th><th scope=\"col\">結果與解讀</th></tr></thead><tbody><tr><th scope=\"row\">IMpower010<br>NCT02486718</th><td>第三期、開放、1:1；第七版IB（≥4 cm）–IIIA；完成切除與 1–4 週期 cisplatin 雙藥化療（搭配 pemetrexed、gemcitabine、docetaxel 或 vinorelbine）後隨機分派1005人：atezolizumab組507人、最佳支持照護組498人</td><td>atezolizumab 1200 mg 每 3 週一次共 16 次，與最佳支持照護比較。主要終點：DFS，依序檢定 PD-L1≥1% 的 II–IIIA 期 → 所有 II–IIIA 期 → 全體（階層檢定）</td><td>2021報告：PD-L1≥1%的II–IIIA DFS HR 0.66（95% CI 0.50–0.88）。此數據不是全體IB–IIIA結果。</td></tr><tr><th scope=\"row\">PEARLS／KEYNOTE-091<br>NCT02504372</th><td>第三期、三盲、1:1；完整切除IB（≥4 cm）–IIIA（第七版）；共1177人；pembrolizumab組：590人；安慰劑組：587人；術後化療依期別建議</td><td>pembrolizumab 200 mg 每 3 週一次最多 18 次，與安慰劑比較。共同主要終點：全體族群的 DFS，以及 PD-L1 TPS≥50% 族群的 DFS</td><td>2022報告：全體DFS HR 0.76（95% CI 0.63–0.91）；PD-L1 TPS≥50%族群HR 0.82（0.57–1.18），p=0.14。</td></tr></tbody></table></div><p class=\"table-note\">PD-L1檢測平台、門檻、分期與化療規定會影響適用性。研究中納入的分子型別不應依章節主題而被改寫為全數driver陰性。 <span class=\"cites\"><a href=\"#ref-im010\" aria-label=\"參考文獻：IMpower010：Felip et al., Lancet 2021\">[25]</a> <a href=\"#ref-kn091\" aria-label=\"參考文獻：PEARLS／KEYNOTE-091：O’Brien et al., Lancet Oncology 2022\">[26]</a></span></p>"]}, {"id": "unresectable", "title": "不可切除的局部晚期疾病", "subtitle": "化放療時序、鞏固與升階的隨機證據", "pages": ["<p>不可切除第III期疾病的研究通常以根治性化學放射治療（chemoradiotherapy, CRT）為基礎。同步CRT（cCRT）與序列CRT（sCRT）不可互換；試驗是在CRT前或CRT後才隨機，也會改變被納入的風險人群。 <span class=\"cites\"><a href=\"#ref-pacific\" aria-label=\"參考文獻：PACIFIC：Antonia et al., NEJM 2017，研究方法與 PFS\">[27]</a> <a href=\"#ref-laura\" aria-label=\"參考文獻：LAURA：Lu et al., NEJM 2024\">[29]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"不可切除第 III 期的隨機試驗方法\"><table><caption>表 15．不可切除第 III 期的隨機試驗方法</caption><thead><tr><th scope=\"col\">試驗</th><th scope=\"col\">隨機分派時點</th><th scope=\"col\">設計／人數</th><th scope=\"col\">研究治療與主要終點</th></tr></thead><tbody><tr><th scope=\"row\">PACIFIC<br>NCT02125461</th><td>不可切除第III期；含鉑cCRT後未惡化，完成後1–42天；未依PD-L1篩選</td><td>第三期、雙盲、2:1；共713人；durvalumab組：476人；安慰劑組：237人</td><td>durvalumab 10 mg/kg 每 2 週一次最多 12 個月，與安慰劑比較。共同主要終點：PFS 與 OS。</td></tr><tr><th scope=\"row\">LAURA<br>NCT03521154</th><td>不可切除第III期，EGFR Ex19del／L858R；根治性cCRT或sCRT後未惡化</td><td>第三期、雙盲、2:1；共216人；osimertinib組：143人；安慰劑組：73人</td><td>osimertinib 80 mg 每日一次，與安慰劑比較；用到疾病惡化或無法耐受為止。主要終點：PFS（盲性獨立中央審查）。</td></tr><tr><th scope=\"row\">POLESTAR<br>NCT04951635</th><td>不可切除第III期、常見敏感EGFR突變；根治CRT後未惡化</td><td>第三期、雙盲、2:1；共147人：aumolertinib組94人、安慰劑組53人；中期療效mITT142人</td><td>aumolertinib 110 mg 每日一次，與安慰劑比較。主要終點：PFS（盲性獨立中央審查）。</td></tr><tr><th scope=\"row\">PACIFIC-2<br>NCT03519971</th><td>不可切除第III期；從cCRT開始時即隨機</td><td>第三期、雙盲、2:1；共328人；durvalumab組：219人；安慰劑組：109人</td><td>durvalumab 或安慰劑從同步化放療第一天就一起給；化放療結束後未惡化者依原分組續用 durvalumab 或安慰劑鞏固，用到疾病惡化為止。主要終點：PFS。</td></tr></tbody></table></div><p class=\"table-note\">PACIFIC-2的對照組在CRT後仍為安慰劑；它不是「同步免疫＋鞏固免疫」直接對照現行「CRT後才開始免疫」的試驗。 <span class=\"cites\"><a href=\"#ref-pacific\" aria-label=\"參考文獻：PACIFIC：Antonia et al., NEJM 2017，研究方法與 PFS\">[27]</a> <a href=\"#ref-laura\" aria-label=\"參考文獻：LAURA：Lu et al., NEJM 2024\">[29]</a> <a href=\"#ref-polestar\" aria-label=\"參考文獻：POLESTAR：IASLC／ILCN 2024，中期分析報告\">[31]</a> <a href=\"#ref-polestarreg\" aria-label=\"參考文獻：POLESTAR：ClinicalTrials.gov，NCT04951635\">[32]</a> <a href=\"#ref-pacific2\" aria-label=\"參考文獻：PACIFIC-2：Bradley et al., JCO 2025\">[33]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"CRT 後治療：效益、毒性與資料版本\"><table><caption>表 16．CRT 後治療：效益、毒性與資料版本</caption><thead><tr><th scope=\"col\">試驗／版本</th><th scope=\"col\">結果</th><th scope=\"col\">該結果支持什麼</th></tr></thead><tbody><tr><th scope=\"row\">PACIFIC<br>2022五年追蹤；截止2021/1/11</th><td>五年OS 42.9% vs 33.4%；OS HR 0.72（95% CI 0.59–0.89）。五年PFS 33.1% vs 19.0%；PFS HR 0.55（0.45–0.68）</td><td>支持完成cCRT且未惡化人群的durvalumab鞏固策略；不能當作從診斷起全部病人的存活率。</td></tr><tr><th scope=\"row\">LAURA<br>2024主要分析</th><td>中位PFS 39.1 vs 5.6月；HR 0.16（95% CI 0.10–0.24）；p&lt;0.001</td><td>支持敏感EGFR突變疾病CRT後osimertinib；本版OS尚未成熟，PFS不等於治癒率。</td></tr><tr><th scope=\"row\">POLESTAR<br>2024中期分析</th><td>mITT中位PFS 30.4 vs 3.8月；HR 0.20（95% CI 0.114–0.352）</td><td>另一項EGFR選定族群的CRT後標靶研究；不可與LAURA直接比較兩藥優劣。</td></tr><tr><th scope=\"row\">PACIFIC-2<br>2025報告</th><td>PFS HR 0.85（95% CI 0.65–1.12），p=0.247；OS HR 1.03（0.78–1.39），p=0.823</td><td>未證實從cCRT一開始加入durvalumab較安慰劑策略改善主要終點；不推翻PACIFIC的CRT後鞏固證據。</td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-pacific5\" aria-label=\"參考文獻：PACIFIC：Spigel et al., JCO 2022，五年追蹤\">[28]</a> <a href=\"#ref-laura\" aria-label=\"參考文獻：LAURA：Lu et al., NEJM 2024\">[29]</a> <a href=\"#ref-polestar\" aria-label=\"參考文獻：POLESTAR：IASLC／ILCN 2024，中期分析報告\">[31]</a> <a href=\"#ref-pacific2\" aria-label=\"參考文獻：PACIFIC-2：Bradley et al., JCO 2025\">[33]</a></span></p>", "<p>LAURA的用藥期間與ADAURA不同：前者治療至疾病惡化或不能接受的毒性，後者預定最多三年。不可把可切除疾病的固定年限套用到不可切除疾病，也不能因ctDNA陰性自行推導出已驗證的停藥規則。 <span class=\"cites\"><a href=\"#ref-laura\" aria-label=\"參考文獻：LAURA：Lu et al., NEJM 2024\">[29]</a> <a href=\"#ref-adaura\" aria-label=\"參考文獻：ADAURA：Tsuboi et al., NEJM 2023，計畫性最終 OS 分析\">[14]</a> <a href=\"#ref-lauraguide\" aria-label=\"參考文獻：ASCO 2024：第 III 期 NSCLC 指引快速更新\">[30]</a></span></p><p>LAURA報告第3級以上不良事件35% vs 12%，放射性肺炎48% vs 38%，多為第1–2級。這些是CRT後接受試驗治療者的事件；不同研究對肺炎、放射性肺炎與歸因的定義不一，安全性比較也要保留設定。 <span class=\"cites\"><a href=\"#ref-laura\" aria-label=\"參考文獻：LAURA：Lu et al., NEJM 2024\">[29]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"CheckMate 73L：同步期加入免疫的第三期比較\"><table><caption>表 17．CheckMate 73L：同步期加入免疫的第三期比較</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>未治療、不可切除第III期NSCLC；在化放療前隨機分派。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>第三期，原規劃1:1:1；共925人。A組nivolumab後接nivolumab＋ipilimumab：287人；B組nivolumab後接nivolumab：320人；C組化放療後接durvalumab：318人。</td></tr><tr><th scope=\"row\">介入與對照</th><td>A、B組同步化放療時即加入nivolumab；A組鞏固nivolumab＋ipilimumab，B組鞏固nivolumab；C組同步化放療後鞏固durvalumab。鞏固最多1年。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要終點：A 組與 C 組的 PFS 比較（盲性獨立中央審查）。</td></tr><tr><th scope=\"row\">結果與版本</th><td>2026原始論文：A組PFS16.7月、C組15.6月，HR 0.95（96% CI 0.77–1.19），p=0.65。A對C描述性OS HR 1.12（95% CI 0.87–1.43）；B對C PFS HR 0.84（0.69–1.04）。nivolumab兩組肺炎增加。</td></tr><tr><th scope=\"row\">如何解讀</th><td>未證實同步期提早加入免疫及雙免疫鞏固的主要終點效益。與PACIFIC化放療完成且未惡化後才隨機的人群不同。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT04026412\">NCT04026412</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-cm73l\" aria-label=\"參考文獻：CheckMate 73L：Nature Cancer 2026，第三期主要結果（PMID 42129521）\">[45]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"PACIFIC-5：同步或序列化放療後的鞏固治療\"><table><caption>表 18．PACIFIC-5：同步或序列化放療後的鞏固治療</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>不可切除III期；完成同步或序列化放療後未惡化。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>第三期、雙盲、2:1隨機。durvalumab組：272人；安慰劑組：135人。主要mITT：durvalumab組252人、安慰劑組129人；排除EGFR／ALK異常或相關未知個案。</td></tr><tr><th scope=\"row\">介入與對照</th><td>durvalumab 1500 mg 每 4 週一次，與安慰劑比較；用到疾病惡化、無法耐受毒性或撤回同意為止，不是固定一年。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要終點：PFS（盲性獨立中央審查）；OS 為次要終點。</td></tr><tr><th scope=\"row\">結果與版本</th><td>2025分析：mITT中位PFS durvalumab組14.0月、安慰劑組6.5月，HR 0.75（95% CI 0.58–0.99），p=0.038。期中OS38.3月對32.5月，HR 0.87（0.66–1.17），p=0.346。安全族群durvalumab組271人、安慰劑組134人；第3–4級全原因不良事件73/271對32/134，治療相關死亡4/271對0/134。</td></tr><tr><th scope=\"row\">如何解讀</th><td>PFS達顯著，OS尚未證實優勢；同步與序列化放療子群各自的信賴區間都跨過 1（子群數字見原文），不能說兩個子群都獨立達顯著。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT03706690\">NCT03706690</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-pacific5trial\" aria-label=\"參考文獻：PACIFIC-5：2025 第三期原始論文\">[46]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"GEMSTONE-301：化放療後 sugemalimab\"><table><caption>表 19．GEMSTONE-301：化放療後 sugemalimab</caption><thead><tr><th scope=\"col\">閱讀項目</th><th scope=\"col\">研究內容</th></tr></thead><tbody><tr><th scope=\"row\">研究情境（setting）</th><td>中國50中心，不可切除III期；同步或序列化放療後未惡化。</td></tr><tr><th scope=\"row\">設計與人數（methods）</th><td>第三期、雙盲、2:1隨機。sugemalimab組：255人；安慰劑組：126人。</td></tr><tr><th scope=\"row\">介入與對照</th><td>sugemalimab 1200 mg 每 3 週一次最多 24 個月，與安慰劑比較。</td></tr><tr><th scope=\"row\">終點／分析</th><td>主要終點：PFS（盲性獨立中央審查）；初次分析與延伸追蹤的數字各自保留版本。</td></tr><tr><th scope=\"row\">結果與版本</th><td>2022主要分析：PFS sugemalimab組9.0月、安慰劑組5.8月，HR 0.64（95% CI 0.48–0.85），p=0.0026。EMA延伸追蹤（中位39.6月）：PFS10.6月對6.2月，HR 0.73（0.56–0.95）；OS47.4月對32.4月，HR 0.78（0.57–1.05）。</td></tr><tr><th scope=\"row\">如何解讀</th><td>OS更新未達顯著。約三分之二接受同步化放療；全為亞洲人，92.1%男性、69.8%鱗癌，外推須保留族群差異。不同截止日的中位數與HR不能拼成單次分析。</td></tr><tr><th scope=\"row\">研究登錄</th><td><a href=\"https://clinicaltrials.gov/study/NCT03728556\">NCT03728556</a></td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-gem301\" aria-label=\"參考文獻：GEMSTONE-301：Lancet Oncology 2022，主要分析\">[47]</a> <a href=\"#ref-gem301update\" aria-label=\"參考文獻：GEMSTONE-301：EMA產品資料，延伸追蹤\">[48]</a></span></p>"]}, {"id": "sequence", "title": "邊界可切除與治療序列研究", "subtitle": "追蹤每位開始誘導治療的病人", "pages": ["<p>轉換手術（conversion surgery）指原先無法切除、經治療後重新取得切除可能；救援手術（salvage surgery）則常用於根治性非手術治療後的局部殘存或復發。研究間用語仍有差異，閱讀時應回到初始治療意圖、重新評估時間及實際納入條件。</p><p>2026年 EORTC 與多個學會的 Delphi 共識提出第 III 期「技術可切除性」定義：由多專科團隊內有經驗的胸腔外科醫師判定；初始評估需 PET-CT、腦部 MRI 與侵入性縱膈分期；IIIA 大致視為可切除，IIIB 依 N2 型態（單站多可切除、多站或巨大 N2 多不可切除、侵犯性 N2 或 N3 不可切除），IIIC 不可切除。此定義的目的為統一試驗納入條件，不等於個別病人的手術決策。 <span class=\"cites\"><a href=\"#ref-resectconsensus\" aria-label=\"參考文獻：第 III 期 NSCLC 技術可切除性共識定義：Dingemans et al., Lancet Respiratory Medicine 2026（EORTC 多學會 Delphi）\">[56]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"改變局部治療路徑與誘導策略的研究\"><table><caption>表 20．改變局部治療路徑與誘導策略的研究</caption><thead><tr><th scope=\"col\">研究</th><th scope=\"col\">研究情境與設計</th><th scope=\"col\">治療順序與終點</th><th scope=\"col\">資料與限制</th></tr></thead><tbody><tr><th scope=\"row\">MDT-BRIDGE<br>NCT05925530</th><td>全球多中心、非隨機第二期；收案142人（基線可切除92人、邊界可切除50人）；EGFR／ALK野生型，第八版可切除或邊界可切除IIB–IIIB</td><td>durvalumab＋含鉑雙藥化療（搭配藥依組織型選擇）2 週期後由多專科團隊再評估；可切除者再1–2週期後手術＋術後durvalumab 12次，不可切除者化放療＋鞏固durvalumab；主要終點為以全體收案者為分母的切除率</td><td>WCLC 2026 主要分析（截止2026/1/12）：全體切除率74.6%（95% CI 66.7–81.6）；基線可切除者81.5%、邊界可切除者62.0%；切除者R0 96.2%；92.3%接受手術或化放療；再評估為可切除者pCR 27.3%（19.6–36.1），全體23.2%；12個月EFS 88.5%（81.5–92.9），成熟度僅14.1%。手術與CRT路徑不是隨機比較，兩路徑差異不能歸因於手術。</td></tr><tr><th scope=\"row\">APOLO<br>NCT04776447</th><td>17中心、單臂第二期；不可切除IIIA–IIIC；38人</td><td>誘導：atezolizumab 加 carboplatin／paclitaxel 共 3 週期 → 同步化放療（化療再 3 週期）→ 維持：atezolizumab 共 16 次。主要終點：12 個月 PFS</td><td>截止2024/2，中位追蹤29.6月；12月PFS 68.4%（95% CI 51.1–80.7），對預設虛無值55%；並非對PACIFIC隨機比較。</td></tr><tr><th scope=\"row\">PACIFIC-Brazil<br>NCT04230408</th><td>巴西8中心、單臂第二期；49人；局部晚期不可切除族群</td><td>誘導：durvalumab 加含鉑雙藥化療 → 同步化放療期間繼續 durvalumab → 鞏固：durvalumab。主要終點：12 個月 PFS，從治療開始起算</td><td>WCLC2024：12月PFS 68.1%（95% CI 56.0–82.8）；另有鞏固起點landmark分析，分母與起算點需分清。</td></tr><tr><th scope=\"row\">NEOLA<br>NCT06194448</th><td>全球、多中心、開放、單臂第二期；不可切除第III期敏感EGFR突變</td><td>誘導：osimertinib → 根治性化放療 → 之後繼續 osimertinib。主要終點：12 個月 PFS</td><td>本表為2025 protocol設計；這是將TKI提前的研究，非LAURA的直接替代證據。</td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-bridge\" aria-label=\"參考文獻：MDT-BRIDGE：2024 研究設計論文\">[34]</a> <a href=\"#ref-bridgereg\" aria-label=\"參考文獻：MDT-BRIDGE：ClinicalTrials.gov，NCT05925530\">[35]</a> <a href=\"#ref-apolo\" aria-label=\"參考文獻：APOLO：Nature Communications，第二期研究全文\">[36]</a> <a href=\"#ref-brazil\" aria-label=\"參考文獻：PACIFIC-Brazil：WCLC 2024 正式摘要（原摘要集網址已下線）；研究登錄 ClinicalTrials.gov NCT04230408\">[37]</a> <a href=\"#ref-neola\" aria-label=\"參考文獻：NEOLA：2025 研究計畫論文\">[38]</a> <a href=\"#ref-bridge2026\" aria-label=\"參考文獻：MDT-BRIDGE：Reck et al., WCLC 2026 OA04.02，主要分析（資料截止 2026/1/12）\">[52]</a></span></p>", "<p>APOLO從38名起始病人中，有32名開始cCRT，29名開始維持治療，16名完成計畫療程。這種完整流程的分母，比只報進入維持治療者的結果更能呈現可行性。PACIFIC則在病人已完成cCRT且未惡化後才隨機；兩者不能只把12月PFS排在一起，就認定哪一條路徑較好。 <span class=\"cites\"><a href=\"#ref-apolo\" aria-label=\"參考文獻：APOLO：Nature Communications，第二期研究全文\">[36]</a> <a href=\"#ref-pacific\" aria-label=\"參考文獻：PACIFIC：Antonia et al., NEJM 2017，研究方法與 PFS\">[27]</a></span></p>", "<aside class=\"callout\"><strong>邊界可切除研究最需要保留的資料</strong><p>起始評估為可切除、邊界可切除或不可切除的人各有多少？多少人最後完成手術、根治CRT，或兩者都未完成？死亡與進展從哪一天起算？若這些欄位不完整，成功手術者的良好存活可能反映選人，而不是手術造成的效果。</p></aside><p>WCLC 2026 報告的 JS207（PD-1／VEGF 雙特異性抗體）＋化療第二期是這類資料的例子：42名不可切除第 III 期（N3 占47.6%）接受3週期後由多專科團隊再評估，25/42（59.5%）轉換手術；手術者 pCR 11/22（50.0%）、MPR 17/22；中位追蹤僅7.4月，第3級以上不良事件59.5%，1例治療相關死亡。42、25、22 三個分母必須分開讀，且尚無與化放療的隨機比較。 <span class=\"cites\"><a href=\"#ref-js207\" aria-label=\"參考文獻：JS207（PD-1／VEGF 雙特異性抗體）＋化療：Wu et al., WCLC 2026 OA09.03，不可切除第 III 期第二期會議報告\">[55]</a></span></p>"]}, {"id": "adaptation", "title": "術後升階與降階", "subtitle": "把預後標記與治療效果分開", "pages": ["<p>術後病理反應與循環腫瘤DNA（circulating tumor DNA, ctDNA）可提供復發風險資訊。微量／分子殘留病灶（minimal／molecular residual disease, MRD）陽性與高風險的關聯，仍須與「依此選擇某種加藥或停藥策略是否改善結果」分開。 <span class=\"cites\"><a href=\"#ref-pathinitiative\" aria-label=\"參考文獻：IASLC：病理反應與長期臨床效益驗證計畫\">[42]</a> <a href=\"#ref-adopt\" aria-label=\"參考文獻：ADOPT-lung：ClinicalTrials.gov，2026 年 5 月更新\">[39]</a> <a href=\"#ref-interpath\" aria-label=\"參考文獻：INTerpath-009：ClinicalTrials.gov，2026 年 5 月更新\">[40]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"升階、降階研究真正隨機的是什麼\"><table><caption>表 21．升階、降階研究真正隨機的是什麼</caption><thead><tr><th scope=\"col\">研究</th><th scope=\"col\">進入隨機的情境</th><th scope=\"col\">比較策略／主要問題</th><th scope=\"col\">解讀邊界</th></tr></thead><tbody><tr><th scope=\"row\">ADOPT-lung<br>NCT06284317</th><td>國際、多中心、開放第三期；IIB–IIIB(N2)；先 durvalumab＋含鉑雙藥化療 3–4 週期、手術，R0／R1後隨機；登錄預計290人</td><td>術後 durvalumab 每 4 週一次共 12 次，與單純觀察比較；主要問題是未達 pCR 者加上術後 durvalumab 能否改善 DFS</td><td>術後才分派，比治療前一次決定全療程更能隔離追加免疫的效果。不能誤寫成只納入pCR者。</td></tr><tr><th scope=\"row\">INTerpath-009<br>NCT06623422</th><td>雙盲第三期；可切除II–IIIB(N2)，術前 pembrolizumab＋含鉑雙藥化療後，手術未達 pCR；登錄預計680人</td><td>術後pembrolizumab＋個人化新抗原治療intismeran autogene（V940） vs pembrolizumab＋安慰劑</td><td>檢驗在既有術後免疫上加用新治療的升階；不是比較術後免疫vs觀察。</td></tr></tbody></table></div><p class=\"table-note\">人數為2026年5月登錄的預計收案數，不是已有結果的分析分母。本版未列兩研究療效結論。 <span class=\"cites\"><a href=\"#ref-adopt\" aria-label=\"參考文獻：ADOPT-lung：ClinicalTrials.gov，2026 年 5 月更新\">[39]</a> <a href=\"#ref-interpath\" aria-label=\"參考文獻：INTerpath-009：ClinicalTrials.gov，2026 年 5 月更新\">[40]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"病理反應與 MRD 如何轉成可檢驗的問題\"><table><caption>表 22．病理反應與 MRD 如何轉成可檢驗的問題</caption><thead><tr><th scope=\"col\">觀察結果</th><th scope=\"col\">可提出的研究問題</th><th scope=\"col\">目前不能直接推論</th></tr></thead><tbody><tr><th scope=\"row\">pCR、MRD陰性</th><td>減少術後暴露能否維持EFS／OS，並降低毒性？</td><td>已治癒，或可以普遍停藥、取消手術。</td></tr><tr><th scope=\"row\">非pCR、MRD陽性</th><td>增加、改換或合併治療是否較原策略改善結果？</td><td>高復發風險就代表任何升階治療都有效。</td></tr><tr><th scope=\"row\">非pCR、MRD陰性</th><td>能否結合殘存腫瘤比例、ypN、檢測敏感度進一步分層？</td><td>陰性已排除微量病灶。</td></tr><tr><th scope=\"row\">影像完全反應</th><td>是否有足夠的病理／生物標記佐證可安全調整局部治療？</td><td>影像反應等同pCR，或可常規省略切除。</td></tr></tbody></table></div><p class=\"table-note\">此表是研究問題整理，不是已驗證的處方演算法。 <span class=\"cites\"><a href=\"#ref-pathology\" aria-label=\"參考文獻：IASLC：2020 術前治療後切除檢體病理評估建議\">[41]</a> <a href=\"#ref-pathinitiative\" aria-label=\"參考文獻：IASLC：病理反應與長期臨床效益驗證計畫\">[42]</a> <a href=\"#ref-adopt\" aria-label=\"參考文獻：ADOPT-lung：ClinicalTrials.gov，2026 年 5 月更新\">[39]</a> <a href=\"#ref-interpath\" aria-label=\"參考文獻：INTerpath-009：ClinicalTrials.gov，2026 年 5 月更新\">[40]</a></span></p>", "<p>上述兩項術後隨機研究，分別檢驗「增加術後免疫」與「在術後免疫上再加新治療」。這種設計能讓術前暴露較一致，並把問題集中到手術後的下一步；仍須等待相應的DFS、OS及毒性結果，才能判斷是否值得改變療程。 <span class=\"cites\"><a href=\"#ref-adopt\" aria-label=\"參考文獻：ADOPT-lung：ClinicalTrials.gov，2026 年 5 月更新\">[39]</a> <a href=\"#ref-interpath\" aria-label=\"參考文獻：INTerpath-009：ClinicalTrials.gov，2026 年 5 月更新\">[40]</a></span></p><p>CheckMate 816 的 2025 年最終 OS 報告提供了一個具體例子：達 pCR 者五年 OS 95.3%，未達者 55.7%；術前 ctDNA 清除者 75.0%，未清除者 52.6%。這些是隨機分派後依反應分群的預後關聯，說明 pCR 與 ctDNA 能分層風險，但不回答「依此增減治療是否改善結果」。 <span class=\"cites\"><a href=\"#ref-cm816os\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2025，最終 OS 分析\">[2]</a></span></p>"]}, {"id": "methods", "title": "終點、病理與方法學速查", "subtitle": "保留定義，才能正確比較研究", "pages": ["<p>pCR與MPR都依賴足夠取樣及一致的病理評估。術前治療後的腫瘤床可能混合存活腫瘤、壞死與纖維化；需要同時評估原發病灶及淋巴結，而非只在原發腫瘤找不到癌細胞就宣告pCR。 <span class=\"cites\"><a href=\"#ref-pathology\" aria-label=\"參考文獻：IASLC：2020 術前治療後切除檢體病理評估建議\">[41]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"常用終點與報告方式\"><table><caption>表 23．常用終點與報告方式</caption><thead><tr><th scope=\"col\">縮寫／全名</th><th scope=\"col\">主要意思</th><th scope=\"col\">閱讀時核對</th></tr></thead><tbody><tr><th scope=\"row\">pCR<br>pathologic complete response<br>病理完全反應</th><td>切除的原發腫瘤與淋巴結均無存活腫瘤</td><td>取樣是否足夠；分析以全體分派者或手術者為分母；未手術者如何處理。</td></tr><tr><th scope=\"row\">MPR<br>major pathologic response<br>主要病理反應</th><td>通常指原發腫瘤床殘存存活腫瘤≤10%</td><td>淋巴結要求、R0條件及評估者須依試驗定義；不等同pCR。</td></tr><tr><th scope=\"row\">RVT<br>residual viable tumor<br>殘存存活腫瘤</th><td>治療後腫瘤床的存活腫瘤比例</td><td>分母是病理腫瘤床；不是影像直徑縮小百分比。</td></tr><tr><th scope=\"row\">EFS<br>event-free survival<br>無事件存活</th><td>常從術前隨機分派起算，包含影響手術的進展、復發或死亡</td><td>事件定義、取消手術、無法切除如何計入，各試驗可能不同。</td></tr><tr><th scope=\"row\">DFS<br>disease-free survival<br>無病存活</th><td>常用於根治切除後，觀察復發或死亡</td><td>研究隨機分派前已發生的手術失敗不在這個族群內。</td></tr><tr><th scope=\"row\">PFS<br>progression-free survival<br>無惡化存活</th><td>從指定起點到疾病惡化或死亡</td><td>起算點依設計不同：鞏固型試驗（PACIFIC、LAURA）在化放療完成後隨機起算；PACIFIC-2、CheckMate 73L 在化放療開始前隨機起算；誘導型單臂研究從誘導治療開始起算。三者選入的人群不同。</td></tr><tr><th scope=\"row\">OS<br>overall survival<br>整體存活</th><td>從指定起點到任何原因死亡</td><td>固定年數的存活率、中位OS、追蹤中位數、死亡事件成熟度不是同一指標。</td></tr><tr><th scope=\"row\">R0／R1／R2</th><td>切緣無腫瘤／顯微殘存／肉眼殘存</td><td>單列R0不足以交代淋巴結評估品質與完整切除的所有要求。</td></tr><tr><th scope=\"row\">ITT／mITT</th><td>意向治療／修正版意向治療分析</td><td>保留原隨機分組；mITT須說明排除誰，不能任意排除未手術者。</td></tr><tr><th scope=\"row\">HR／CI</th><td>hazard ratio／confidence interval<br>風險比／信賴區間</td><td>HR是隨時間的相對風險指標，不是固定年數的絕對風險下降；CI是否經多重檢定調整也須保留。</td></tr></tbody></table></div><p class=\"table-note\"> <span class=\"cites\"><a href=\"#ref-pathology\" aria-label=\"參考文獻：IASLC：2020 術前治療後切除檢體病理評估建議\">[41]</a> <a href=\"#ref-cm816\" aria-label=\"參考文獻：CheckMate 816：Forde et al., NEJM 2022，主要分析\">[1]</a> <a href=\"#ref-neoadaura\" aria-label=\"參考文獻：NeoADAURA：He et al., JCO 2025，主要分析\">[12]</a> <a href=\"#ref-pacific\" aria-label=\"參考文獻：PACIFIC：Antonia et al., NEJM 2017，研究方法與 PFS\">[27]</a></span></p>", "<p>病人層級的預後關聯，和試驗層級的替代終點驗證不同。前者問達pCR者是否較少復發；後者問一種治療提高pCR的幅度，能否可靠預測該治療改善EFS或OS的幅度。要把病理結果用於停藥或省略治療，需要後一層證據及對應的介入研究。 <span class=\"cites\"><a href=\"#ref-pathinitiative\" aria-label=\"參考文獻：IASLC：病理反應與長期臨床效益驗證計畫\">[42]</a></span></p>", "<div class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"分子、分期與研究用語\"><table><caption>表 24．分子、分期與研究用語</caption><thead><tr><th scope=\"col\">用語</th><th scope=\"col\">中文及英文全名／說明</th></tr></thead><tbody><tr><th scope=\"row\">EGFR／ALK／RET</th><td>EGFR：表皮生長因子受體（epidermal growth factor receptor）；ALK：間變性淋巴瘤激酶（anaplastic lymphoma kinase）；RET：RET原癌基因（rearranged during transfection）。須區分突變與融合，並按試驗要求確認。</td></tr><tr><th scope=\"row\">PD-L1／TPS</th><td>PD-L1：程式性死亡配體1（programmed death-ligand 1）；TPS：腫瘤比例分數（tumor proportion score），以腫瘤細胞表現比例計。不同試驗的檢測平台與評分規則要分開讀。</td></tr><tr><th scope=\"row\">TNM／ypTNM</th><td>TNM：原發腫瘤（tumor）、區域淋巴結（node）、遠端轉移（metastasis）；yp表示經術前治療後的病理分期。第七、八、九版的同名期別不能直接視作同一人群。</td></tr><tr><th scope=\"row\">ECOG／MDT</th><td>ECOG：Eastern Cooperative Oncology Group，試驗常用其體能狀態評分；MDT：multidisciplinary team，多專科團隊。</td></tr><tr><th scope=\"row\">BICR／landmark</th><td>BICR：blinded independent central review，盲性獨立中央審查。Landmark可能指固定時間點的存活估計，也可能指在指定時點重新選定族群的分析，須看實際方法。</td></tr></tbody></table></div>", "<aside class=\"callout\"><strong>讀完一項試驗，至少能回答這四個問題</strong><p>誰在什麼治療階段被納入？隨機改變了哪一段療程？主要終點從何時起算、誰評估？目前結果能支持到哪個臨床決策，哪些仍屬假說？</p></aside>"]}], "refs": {"cm816": ["CheckMate 816：Forde et al., NEJM 2022，主要分析", "https://pubmed.ncbi.nlm.nih.gov/35403841/", "同儕審查論文"], "cm816os": ["CheckMate 816：Forde et al., NEJM 2025，最終 OS 分析", "https://www.nejm.org/doi/10.1056/NEJMoa2502931", "同儕審查論文"], "kn671": ["KEYNOTE-671：Wakelee et al., NEJM 2023，研究方法與首次分析", "https://pubmed.ncbi.nlm.nih.gov/37272513/", "同儕審查論文"], "kn671os": ["KEYNOTE-671：Spicer et al., Lancet 2024，第二次中期分析", "https://pubmed.ncbi.nlm.nih.gov/39288781/", "同儕審查論文"], "kn671five": ["KEYNOTE-671：Wakelee et al., Annals of Oncology 2026，五年追蹤", "https://pubmed.ncbi.nlm.nih.gov/42628840/", "同儕審查論文"], "aegean": ["AEGEAN：Heymach et al., NEJM 2023", "https://www.nejm.org/doi/full/10.1056/NEJMoa2304875", "同儕審查論文"], "cm77t": ["CheckMate 77T：Cascone et al., NEJM 2024", "https://www.nejm.org/doi/full/10.1056/NEJMoa2311926", "同儕審查論文"], "r315": ["RATIONALE-315：Wang et al., Annals of Oncology 2026，最終分析", "https://pubmed.ncbi function emphasizeContent(){
 const pattern=/HR\s?\d+(?:\.\d+)?|\d+(?:\.\d+)?%\s?vs\s?\d+(?:\.\d+)?%|(?<![\d.])p\s?[=<]\s?\d*\.\d+|未達(?:預設)?(?:顯著|門檻)|尚未成熟|未成熟|探索性|非隨機|不是頭對頭比較/g;

}

 if(!t.metrics.length)return '';

function hrPlot(c){
 const lo=Math.min(.25,c.lo/1.25),hi=Math.max(2,c.hi*1.25),ci=c.ci||'95% CI';const x=v=>40+(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*420;const ticks=[.05,.1,.25,.5,1,2,4].filter(v=>v>=lo&&v<=hi);
 return '<figure class="result-figure"><figcaption><span class="eyebrow">HAZARD RATIO</span><h2>'+e(c.title)+'</h2></figcaption><div class="hr-value">HR '+e(c.value)+' <small>（'+e(ci)+' '+e(c.lo)+'–'+e(c.hi)+'）</small></div><svg class="hr-plot" viewBox="0 0 500 98" role="img" aria-label="'+e(c.title+'，HR '+c.value+'，'+ci+' '+c.lo+'至'+c.hi)+'"><line x1="40" x2="460" y1="55" y2="55" stroke="#bdcfe6"/><line x1="'+x(1)+'" x2="'+x(1)+'" y1="8" y2="62" stroke="#855128" stroke-dasharray="4 3"/><line x1="'+x(c.lo)+'" x2="'+x(c.hi)+'" y1="30" y2="30" stroke="#215eaa" stroke-width="4"/><circle cx="'+x(c.value)+'" cy="30" r="6" fill="#215eaa"/>'+ticks.map(v=>'<text x="'+x(v)+'" y="82" text-anchor="middle" fill="#526980" font-size="14">'+v+'</text>').join('')+'</svg><p class="chartnote">橫線為信賴區間（'+e(ci)+'），圓點為HR；虛線1代表兩組危險率相同。橫軸採對數尺度'+(c.hi>=1?'；區間跨過1表示未達統計顯著':'')+'。</p><p class="chartnote">'+e(c.note)+'</p><details class="diagram-sources"><summary>圖表資料來源</summary>'+sourceLinks(c.refs)+'</details></figure>';
}

function home(){app.innerHTML='<div class="home"><div class="home-intro"><div><div class="eyebrow">從臨床問題開始</div><h1>你想釐清哪一段治療？</h1><p class="muted">先選情境，再讀研究。把族群、隨機分派與治療時序放在一起看，逐步找到證據能回答的問題。</p></div></div>'+D.sections.map(sec=>{const gs=D.groups.filter(g=>g[4]===sec[0]);const n=D.trials.filter(t=>group(t.group)[4]===sec[0]).length;return '<section class="home-section"><h2><a href="#explore?group=sec:'+sec[0]+'">'+sec[1]+'</a><span class="sec-count">'+n+' 項研究</span></h2><p class="muted sec-desc">'+sec[2]+'</p><div class="cards">'+gs.map(g=>'<a class="card" href="#explore?group='+g[0]+'"><span class="number">'+String(D.groups.indexOf(g)+1).padStart(2,'0')+' / '+D.trials.filter(t=>t.group===g[0]).length+' 項研究</span><strong>'+g[1]+'</strong><p>'+g[2]+'</p><span class="go">進入研究清單 →</span></a>').join('')+'</div></section>'}).join('')+'<div class="shortcuts"><a href="#compare?preset=0,3">術後追加免疫：CheckMate 816 與 77T 的設計差在哪？ →</a><a href="#topics/methods/0">先理解 EFS、DFS 與 PFS →</a></div><details class="scope-note"><summary>清單收錄範圍</summary><p>選錄非小細胞肺癌術前、圍手術期、術後及不可切除第III期的關鍵研究，並納入陰性試驗與治療升降階計畫。不是所有肺癌試驗的完整清單；未全面涵蓋歷史化療、放療技術、手術方式、轉移期或小細胞肺癌研究。各項數據依其標示的發表版本閱讀。WCLC 2026 會議報告（MDT-BRIDGE 主要分析、NAUTIKA1 KRAS G12C 隊列、RAPHAEL、JS207）以簡報為據，數字待正式發表後更新。</p></details><p class="chartnote">文獻整理日期：2026.09.19。各項數據保留其分析版本與研究情境。</p><p class="chartnote">本頁為教育用途的文獻閱讀整理，不構成個別病人的治療建議；治療決策請依主治團隊與現行指引。</p></div>'}
function listHTML(id){const q=query.toLowerCase();const rows=D.trials.filter(t=>inFilter(t)&&(!q||(t.name+' '+t.search).toLowerCase().includes(q)));let last='';const items=rows.map(t=>{const g=group(t.group);const key=g[0];const headEl=(key!==last&&filter!==key)?'<div class="list-head"><span>'+section(g[4])[1]+'</span>'+g[1]+'</div>':'';last=key;return headEl+'<div class="trial-item '+(id===t.id?'selected':'')+'"><a href="#trial/'+t.id+'"><span>'+t.name+'</span><small>'+g[1]+'</small></a>'+pickButton(t)+'</div>'}).join('');return '<div class="count" aria-live="polite">'+rows.length+' 項符合條件</div><div class="trial-list">'+(items||'<div class="empty">沒有符合的研究。<br>試試其他名稱、藥物或條件。</div>')+'</div>'}
function explorer(id){const t=trial(id);app.innerHTML='<div class="workspace '+(t?'has-detail':'')+'"><aside class="sidebar"><h2>找試驗</h2><label class="sr" for="search">搜尋試驗、藥物或條件</label><input id="search" placeholder="搜尋試驗、藥物或條件" value="'+e(query)+'"><label class="sr" for="group">治療情境</label><select id="group"><option value="all">全部情境</option>'+D.sections.map(sec=>'<optgroup label="'+sec[1]+'"><option value="sec:'+sec[0]+'" '+(filter==='sec:'+sec[0]?'selected':'')+'>全部'+sec[1]+'</option>'+D.groups.filter(g=>g[4]===sec[0]).map(g=>'<option value="'+g[0]+'" '+(filter===g[0]?'selected':'')+'>　'+g[1]+'</option>').join('')+'</optgroup>').join('')+'</select><div id="list-area" style="display:flex;flex-direction:column;flex:1;min-height:0">'+listHTML(id)+'</div><div class="sidebar-bottom"><a href="#compare">比較已選研究（'+picked.length+'／'+MAX_PICK+'） →</a></div></aside><div class="content">'+(t?'<a class="mobile-back" href="#explore">← 回到研究清單</a><div class="detail-head"><div><div class="crumb">'+section(group(t.group)[4])[1]+' ／ '+group(t.group)[1]+'</div><h1>'+t.name+'</h1></div>'+pickButton(t)+'</div>'+tabs('detail',tab)+'<div class="panel" role="tabpanel">'+(tab==='refs'?sourceLinks(t.refs): (tab==='design'?designDiagram(t):tab==='result'?chart(t):'')+fields(t,tab))+'<p class="panel-intro"><a href="#topics/'+group(t.group)[3]+'/0">相關主題與完整表格 →</a></p></div>':'<div class="empty"><div class="eyebrow">研究工作區</div><h1>從左側選擇一項研究</h1><p>設定與方法、結果、解讀分頁呈現。<br>也可以加入 2–6 項研究，並排閱讀。</p></div>')+'</div></div>';document.getElementById('search').oninput=ev=>{query=ev.target.value;document.getElementById('list-area').innerHTML=listHTML(id)};document.getElementById('group').onchange=ev=>{filter=ev.target.value;document.getElementById('list-area').innerHTML=listHTML(id)}}
function compare(){app.innerHTML='<div class="compare-page"><div class="compare-toolbar"><div><div class="eyebrow">SIDE BY SIDE</div><h1>研究比較 <small>'+picked.length+'／'+MAX_PICK+'</small></h1></div><div><a href="#explore">加入研究</a> <button id="clear">清空選擇</button></div></div><div class="comparison-note">不同試驗不是頭對頭比較。請先核對族群、隨機時間、對照組及分析版本，再閱讀結果。'+(picked.length>4?'目前已選'+picked.length+'項，超過螢幕可同時顯示的欄數，表格可左右捲動；左側項目名稱會固定。':'')+'</div>'+tabs('compare',compTab)+(picked.length?comparisonMatrix():'<div class="empty"><h2>先選擇要一起閱讀的研究</h2><p>可並排查看最多六項研究的設定、方法、結果與來源。</p><a href="#explore">前往研究清單 →</a><p><a href="#compare?preset=0,3">先看 CheckMate 816 與 77T</a></p></div>')+'</div>';document.getElementById('clear').onclick=()=>{picked=[];savePicked();render()}}
function topics(slug,page){const t=D.topics.find(x=>x.id===slug);page=Math.max(0,Math.min(Number(page)||0,t?t.pages.length-1:0));app.innerHTML='<div class="workspace '+(t?'has-detail':'')+'"><aside class="sidebar"><h2>主題閱讀</h2><div class="topic-list">'+D.topics.map(x=>'<a class="'+(x===t?'active':'')+'" href="#topics/'+x.id+'/0">'+x.title+'<small> · '+x.pages.length+' 頁</small></a>').join('')+'</div></aside><div class="content">'+(t?'<a class="mobile-back" href="#topics">← 主題目錄</a><div class="crumb">主題閱讀</div><h2>'+t.title+'</h2><div class="muted">'+t.subtitle+'</div><div class="panel reader-body">'+t.pages[page]+'</div><div class="reader-controls"><span>第 '+(page+1)+'／'+t.pages.length+' 頁</span><button data-page="'+(page-1)+'" data-topic="'+slug+'" '+(page===0?'disabled':'')+'>← 上一頁</button><button data-page="'+(page+1)+'" data-topic="'+slug+'" '+(page===t.pages.length-1?'disabled':'')+'>下一頁 →</button></div>':'<div class="empty"><h1>一次理解一個問題</h1><p>選擇主題後，以短篇說明與獨立表格逐頁閱讀。</p></div>')+'</div></div>'}
function sources(key){app.innerHTML='<div class="source-page"><div class="eyebrow">PUBLIC REFERENCES</div><h1>參考文獻與資料版本</h1><p class="panel-intro">資料整理日期：2026.09.19。每筆前方標示來源類型：同儕審查論文、會議摘要、會議簡報、新聞稿、試驗登錄等；非同儕審查來源的數字，日後以正式論文為準。研究設計資料不代表已有療效結果。</p><label class="sr" for="source-search">搜尋參考文獻</label><input id="source-search" placeholder="搜尋試驗名稱、期刊或年份"><ol>'+Object.entries(D.refs).map(([k,r])=>'<li id="ref-'+k+'">'+refTag(r)+'<a href="'+e(r[1])+'" target="_blank" rel="noopener noreferrer">'+e(r[0])+'</a></li>').join('')+'</ol></div>';document.getElementById('source-search').oninput=ev=>{const q=ev.target.value.toLowerCase();document.querySelectorAll('.source-page li').forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(q))};if(key)document.getElementById('ref-'+key)?.scrollIntoView({block:'center'})}
function render(){const [path,qs]=route.split('?'),parts=path.split('/'),params=new URLSearchParams(qs);if(params.has('group'))filter=params.get('group');if(params.has('preset')){picked=params.get('preset').split(',').filter(id=>trial(id)).slice(0,MAX_PICK);route='compare';try{history.replaceState(null,'','#compare')}catch(_){}savePicked()}document.querySelectorAll('.top nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href').slice(1)===(parts[0]==='trial'?'explore':parts[0])));if(parts[0]==='explore'||parts[0]==='trial')explorer(parts[1]);else if(parts[0]==='compare')compare();else if(parts[0]==='topics')topics(parts[1],parts[2]);else if(parts[0]==='sources'||parts[0].startsWith('ref-'))sources(parts[0].startsWith('ref-')?parts[0].slice(4):null);else home();emphasizeContent();app.scrollTop=0}
// Render internal destinations directly; embedded previews may not navigate hashes.
document.addEventListener('click',ev=>{const a=ev.target.closest('a[href^="#"]');if(!a||ev.button!==0||ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.altKey)return;ev.preventDefault();ev.stopPropagation();navigate(a.getAttribute('href'))},true);
app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.pick!==undefined)toggle(b.dataset.pick);if(b.dataset.tab){if(b.dataset.kind==='detail')tab=b.dataset.tab;else compTab=b.dataset.tab;render()}if(b.dataset.page!==undefined)navigate('topics/'+b.dataset.topic+'/'+b.dataset.page)});
function restoreRoute(){route=location.hash.slice(1)||'home';tab='design';render()}
app.addEventListener('keydown',ev=>{const b=ev.target;if(!b.matches||!b.matches('[role=tab]'))return;const tabsEl=[...b.parentElement.querySelectorAll('[role=tab]')];const i=tabsEl.indexOf(b);let j=null;if(ev.key==='ArrowRight')j=(i+1)%tabsEl.length;else if(ev.key==='ArrowLeft')j=(i-1+tabsEl.length)%tabsEl.length;if(j===null)return;ev.preventDefault();const kind=tabsEl[j].dataset.kind;tabsEl[j].click();document.querySelector('.tabs button[data-kind="'+kind+'"][aria-selected=true]')?.focus()});
window.addEventListener('hashchange',restoreRoute);window.addEventListener('popstate',restoreRoute);savePicked();render();
})();
</script></body></html>
